  </g>
  <g clip-path="url(#clip_dining_room)">
    <image class="room-photo" x="890.5" y="142.5" width="320" height="271" transform="rotate(-90 1050.5 278)" preserveAspectRatio="xMidYMid slice" href="/local/floorplan/rooms/dining_room.jpg?v=2"/>
  </g>
  <g clip-path="url(#clip_corridor)">
    <image class="room-photo" x="645.5" y="367.5" width="456" height="577" transform="rotate(-90 873.5 656)" preserveAspectRatio="xMidYMid slice" href="/local/floorplan/rooms/corridor.jpg?v=2"/>
  </g>
  <g clip-path="url(#clip_living_room)">
    <image class="room-photo" x="936" y="634" width="294" height="206" transform="rotate(-90 1083 737)" preserveAspectRatio="xMidYMid slice" href="/local/floorplan/rooms/living_room.jpg?v=2"/>
  </g>
  <path id="study" class="room blue has-photo" fill="#2f6ea8" d="M 136,118 L 454,118 L 454,384 L 474,384 L 474,436 L 136,436 Z"/>
  <path id="kitchen" class="room orange has-photo" fill="#a8542f" d="M 457,118 L 915,118 L 915,453 L 690,453 L 690,428 L 478,428 L 478,384 L 457,384 Z"/>
  <path id="dining_room" class="room teal has-photo" fill="#177a74" d="M 915,118 L 1186,118 L 1186,438 L 1058,438 L 1058,423 L 915,423 Z"/>
  <path id="corridor" class="room blue has-photo" fill="#2f6ea8" d="M 585,428 L 690,428 L 690,453 L 915,453 L 915,438 L 1162,438 L 1162,590 L 980,590 L 980,884 L 748,884 L 748,533 L 585,533 Z"/>
  <path id="laundry" class="room gold" fill="#8a6d1f" d="M 586,533 L 744,533 L 744,622 L 586,622 Z"/>
  <path id="bathroom" class="room orange" fill="#a8542f" d="M 579,680 L 744,680 L 744,782 L 579,782 Z"/>
  <path id="living_room" class="room gold has-photo" fill="#8a6d1f" d="M 980,590 L 1186,590 L 1186,884 L 980,884 Z"/>
  <!-- Stair flight in the top-right corner of the foyer. Drawn in plan
       view: two strings + evenly spaced treads. Not a tap target. -->
  <g class="stairs" pointer-events="none">
    <rect x="986" y="444" width="170" height="140"/>
