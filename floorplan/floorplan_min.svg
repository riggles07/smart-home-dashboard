<svg xmlns="http://www.w3.org/2000/svg" viewBox="118 100 1086 802" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Normalised main floor. Geometry: geometry.py (rectilinear, shared walls).
       Room ids are what ha-floorplan binds to.
       The stylesheet is INLINED below on purpose: one file to upload, and
       it cannot go stale separately from the geometry. -->
  <style>
/* ha-floorplan stylesheet for the traced main-floor plan.
 *
 * THIS FILE IS NOT SERVED AS AN ASSET. render_floorplan.py inlines it into
 * floorplan.svg so the card needs exactly ONE uploaded file. Edit this file,
 * then run `python3 render_floorplan.py`; tests/test_floorplan_assets.py fails
 * if the two ever disagree.
 *
 * WHY EVERY SELECTOR IS ID-SCOPED (2026-10-20, second feedback round)
 * -------------------------------------------------------------------
 * floorplan.class_set -- the service the rules use to show ON/OFF -- does NOT
 * merge classes. In ha-floorplan 1.1.5 it is literally:
 *
 *     static setClass(e, t) { e.setAttribute('class', t) }
 *
 * i.e. it REPLACES the whole class attribute. So a rule whose service_data
 * evaluates to "room-on" turns class="room blue has-photo" into class="room-on":
 * the hue class and the has-photo class both vanish, on the very first state
 * update. Every rule below therefore keys off the element ID (which class_set
 * never touches) and the state class alone; the hue is also repeated as a
 * fill="" attribute on the path so the SVG default (black) can never win.
 *
 * PALETTE HISTORY (worth reading before "simplifying" this again):
 *   v1 -- Roborock's own colours, 0.55 alpha. Readable on the map, but alpha
 *         over a dark page composites to near-black.
 *   v2 -- one muted slate for every room, opaque. Fixed the blackness, but threw
 *         away the colour-coded rooms, so the plan read as "black and grey".
 *   v3 -- per-room colour, opaque, brighter lit variant. Colour encodes WHICH
 *         room it is; state is brightness + glow, never hue.
 *   v4 -- THIS. Same visual language, id-scoped so a class wipe cannot break it,
 *         and the photo layer that v3 was missing on the device.
 */

/* ---- base: geometry + stroke ------------------------------------------ */
#bathroom,
#corridor,
#dining_room,
#kitchen,
#laundry,
#living_room,
#study {
  fill-opacity: 1;
  stroke: #ffffff;
  stroke-width: 2;
  stroke-opacity: 0.28;
  transition: fill 220ms ease, stroke-opacity 220ms ease, filter 220ms ease;
}

/* ---- hue = WHICH room ------------------------------------------------- */
#study, #corridor     { fill: #2f6ea8; }   /* blue */
#kitchen, #bathroom   { fill: #a8542f; }   /* orange */
#dining_room          { fill: #177a74; }   /* teal */
#laundry, #living_room { fill: #8a6d1f; }  /* gold */

/* ---- photo layer ------------------------------------------------------
 * The uploaded photos are WALKING-THROUGH phone shots, not overhead shots: the
 * corridor one is eye-level at the top of the stairs, the living-room one is
 * angled with the photographer's bare leg in frame. Pushed through
 *   - preserveAspectRatio="slice"  (crop, never stretch -- set on the image element)
 *   - blur + brightness            (kills the perspective and the clutter)
 *   - the room's own fill as a TINT on top (state still reads)
 * they read as a warm photographic floor rather than a picture pasted in.
 */
.room-photo {
  filter: blur(5px) saturate(0.85) brightness(0.5);
}

/* Where a photo exists, the room fill is a tint over it, not a cover. */
#study,
#corridor,
#kitchen,
#dining_room,
#living_room {
  fill-opacity: 0.42;
  stroke-opacity: 0.35;
}

/* ---- OFF: same hue, dimmed. Still a room, not a hole. ---------------- */
#study.room-off,
#corridor.room-off,
#living_room.room-off {
  fill-opacity: 0.5;
  stroke-opacity: 0.18;
}
#laundry.room-off {
  fill-opacity: 0.55;
  stroke-opacity: 0.18;
}

/* ---- ON: brighter version of the same hue, plus a glow --------------- */
#study.room-on,
#corridor.room-on,
#living_room.room-on,
#laundry.room-on {
  /* the glow is what reads as "lit" on a phone at a glance */
  filter: drop-shadow(0 0 14px rgba(255, 214, 140, 0.65));
  stroke: #ffffff;
  stroke-opacity: 0.85;
}
#study.room-on,
#corridor.room-on { fill: #63b3ff; fill-opacity: 0.55; }   /* blue  */
#living_room.room-on { fill: #ffd75e; fill-opacity: 0.55; } /* gold  */
#laundry.room-on { fill: #ffd75e; fill-opacity: 1; }        /* no photo */

/* Interactive rooms only (those with a rule). */
#study,
#corridor,
#living_room,
#laundry { cursor: pointer; }

#study:hover,
#corridor:hover,
#living_room:hover,
#laundry:hover {
  stroke-opacity: 1;
  filter: drop-shadow(0 0 10px rgba(160, 200, 255, 0.45));
}

/* ---- Stairs: a plan feature, drawn over the foyer fill -----------------
 * They were never in the robot's map (a vacuum cannot climb stairs), so they are
 * stroked rather than tinted: crisp white-ish lines that read as an architectural
 * element instead of as photo texture. Never a tap target. */
.stairs {
  fill: none;
  stroke: #dfe9f5;
  stroke-opacity: 0.55;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  pointer-events: none;
}

/* ---- Unbound rooms: kitchen, dining_room, bathroom --------------------
 * These keep their HUE -- kitchen is orange, dining teal -- because colour means
 * "which room is this", not "is it controllable". Greying them out was worse than
 * useless: they are the two largest rooms on the plan, so a grey fill dominated
 * the whole view and made it read as black-and-grey.
 * Inertness is signalled by the dashed stroke and the missing glow instead.
 * Declared LAST so its fill-opacity wins over the photo tint above. */
#kitchen,
#dining_room,
#bathroom {
  cursor: default;
  pointer-events: none;
  fill-opacity: 0.45;
  stroke-dasharray: 6 5;
  stroke-opacity: 0.35;
}

/* ---- Labels: above the fills, never a tap target ---------------------- */
.room-label {
  fill: #f2f7fc;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.02em;
  paint-order: stroke;
  stroke: #0b1420;
  stroke-width: 5px;
  stroke-linejoin: round;
}

@media (prefers-reduced-motion: reduce) {
  #bathroom,
  #corridor,
  #dining_room,
  #kitchen,
  #laundry,
  #living_room,
  #study { transition: none; }
}
  </style>
