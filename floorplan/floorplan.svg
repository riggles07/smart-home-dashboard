  <image class="room-photo" x="980" y="591" width="113" height="293" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip_living_room)" href="/local/floorplan/rooms/living_room.jpg?v=1"/>
  <image class="room-photo" x="136" y="118" width="337" height="317" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip_study)" href="/local/floorplan/rooms/study.jpg?v=1"/>
