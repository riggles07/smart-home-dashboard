name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # ---------------------------------------------------------------------
      # Why each step exists (this workflow previously ran only pytest, which
      # is why a broken UniFi wire and an unreferenced theme both shipped green)
      # ---------------------------------------------------------------------

      # settings.js must be valid JavaScript with only real Node-RED keys.
      # Covered by tests/test_settings.py, but asserted directly too because a
      # YAML file under a .js name is the failure this workflow used to hide.
      - name: Validate Node-RED settings (syntax + load)
        run: |
          node --check config/settings.js
          node -e "require('./config/settings.js'); console.log('settings.js loads OK')"

      - name: Lint Python code
        # Errors-only rules (pycodestyle E9 + Pyflakes F63/F7/F82): syntax
        # errors and undefined names. The full default rule set reports 188
        # pre-existing findings, so `ruff check .` would fail CI on the first
        # run; this subset currently passes with zero findings.
        run: ruff check . --select E9,F63,F7,F82

      # Structural integrity of the flow graph: dangling wires, orphaned
      # tab/group refs, empty function bodies, duplicate ids.
      - name: Validate flow structure
        run: python3 tools/validate_flows.py flows/all-flows.flow.json
      - name: Regenerate flows and verify drift
        run: |
          echo "=== Regenerating flows ===" 
          python3 tools/gen_flows.py
          echo "=== Checking for drift ===" 
          git diff --exit-code flows/

      # Runs the REAL function bodies extracted from the deployed flow JSON,
      # so a broken guard/URL-construction is caught, not just Python.
      - name: Test flow function logic
        run: node tools/test_flow_functions.js

      # Drives the Home Assistant state + control handlers against stubbed
      # Node-RED globals and a fake websocket. These two nodes once shipped as
      # dead code -- a literal backslash-n turned each body into a single //
      # comment, so it parsed, deployed and reported flows.state=start while
      # doing nothing. Structural checks stayed green throughout.
      - name: Test Home Assistant flow functions
        run: node tools/test_ha_functions.js

      # Asserts the mobile theme is actually WIRED IN (carried by a ui_template,
      # re-asserts the specificity override, hidden tab). A theme file that
      # exists but is referenced by nothing passes a file-existence check.
      - name: Verify theme is wired into the flows
        run: python3 tests/test_theme_wiring.py

      # System Health tab (REQUIREMENTS_V2 §2): asserts the Grafana embed
      # chain end-to-end offline -- tab/groups, ng-src iframes, d-solo+kiosk
      # URLs, the native Prometheus summary path, env docs, iframe CSS, and
      # the Grafana-side prerequisite documentation.
      - name: Verify System Health Grafana wiring
        run: python3 tests/test_system_health.py

      - name: Run test suite
        run: |
          python -m pytest --cov=flows tests/ -q
          # Floor with margin. MEASURED 2026-10-17: flows/ coverage is 90%
          # (1208/1341 statements). A --fail-under=90 gate passes by one
          # rounding step and would fail the build on the next uncovered
          # line, so the gate sits two points below measured reality.
          python -m coverage report --fail-under=88
